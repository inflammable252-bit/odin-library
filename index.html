<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Library</title>
    <link rel="stylesheet" href="./css-reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="mobile-frame">
    <header>
            <h1> Odin Library Notes</h1>
            <nav>
                <input type="search" name="searchbar" id="searchbar">
            </nav>
        </header>
        <main>
            <div id="card-wrapper">
                <!-- <article class="card"></article> -->
            </div>
            <div id="page-wrapper">
                <img src="./next-svgrepo-com.png" alt="Previous" id="previous">
                <div id="pageNumber">1</div>
                <img src="./next-svgrepo-com.png" alt="Next" id="next">
                <button type="button" id="toggle-notes">Toggle notes</button>
            </div>
        </main>
        <section id="bottom">
            <div id="bottom-left">
                <button id="notes">Notes</button>
                <button id="lists">Lists</button>
                <button id="settings">Settings</button>
            </div>
            <details class="add-drawer">
                <summary>
                   <p><span>Add Book</span><span>Cancel</span></p>
                </summary>
                <form action="" method="get" id="bookform">
                    <label for="title">*Title:</label>
                    <input type="text" name="title" id="title" required>

                    <label for="author">*Author:</label>
                    <input type="text" id="author" required>

                    
                    <div id="midform">
                        <label for="pages">*Pages:</label>
                        <input type="number" id="pages" required>
                        <div id="readsection">
                            <p id="read-label" for="readselect">Read:</p>
                            <input type="radio" name="read" id="read" value="Yes" checked>
                            <label for="read">Yes</label>
                            <input type="radio" name="read" id="notread" value="No">
                            <label for="notread">No</label>
                        </div>
                    </div>

                    <label for="note">Note:</label>
                    <input type="text" id="note">
                    <button type="submit" id="create">Create</button>
                </form>
            </details>
        </section>
        <footer></footer>
    </div>
</body>
</html>
